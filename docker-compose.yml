# Local development and integration-test dependencies.
#
# Ports are deliberately non-default and bound to 127.0.0.1: a stray
# `psql -h localhost` from another project should not reach this database, and
# nothing here should be reachable from the network.
services:
  postgres:
    image: postgres:16.4-alpine
    container_name: bet-postgres
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: local_dev_pw
      POSTGRES_DB: expenses
      # scram-sha-256 rather than the trust/md5 defaults, so the local setup
      # exercises the same authentication path as a deployed one.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - bet-pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      # RLS is only as good as the roles around it. Logging connections makes
      # "which role is the app actually using" answerable from the log rather
      # than from someone's memory of the deploy.
      - -c
      - log_connections=on
      - -c
      - log_min_duration_statement=250ms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expenses"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: bet-redis
    ports:
      - "127.0.0.1:6390:6379"
    # appendonly so a restart does not silently drop the Asynq queue mid-test.
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - bet-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The same S3-compatible store the deployed service talks to. There is no
  # local filesystem alternative on purpose: a second storage backend is a
  # second thing that can behave differently, and the difference only ever
  # surfaces as "it worked on my machine".
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: bet-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: local_storage_key
      MINIO_ROOT_PASSWORD: local_storage_secret
    ports:
      - "127.0.0.1:9010:9000"   # S3 API
      - "127.0.0.1:9011:9001"   # web console
    volumes:
      - bet-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Creates the bucket once and exits. MinIO has no equivalent of a database's
  # init directory, so the bucket has to be made by something.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 local_storage_key local_storage_secret &&
        mc mb --ignore-existing local/receipts &&
        echo "bucket ready"
    restart: "no"

  # A mail catcher, not a relay. Everything the worker sends lands here and
  # goes no further, which is the point: a development database full of real
  # addresses would otherwise send real people real notifications.
  mailpit:
    image: axllent/mailpit:latest
    container_name: bet-mailpit
    ports:
      - "127.0.0.1:1026:1025"   # SMTP
      - "127.0.0.1:8026:8025"   # web UI
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bet-pgdata:
  bet-redisdata:
  bet-miniodata:
