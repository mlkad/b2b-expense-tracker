version: "2"

sql:
  - engine: postgresql
    # sqlc reads the goose migrations directly rather than a separate
    # schema.sql. A hand-maintained duplicate of the schema is a file that
    # drifts silently: the generated code keeps compiling against a table shape
    # the database stopped having.
    schema: db/migrations
    queries: db/queries

    gen:
      go:
        package: gen
        out: internal/repository/postgres/gen
        sql_package: pgx/v5

        # The generated structs are a persistence detail. They are mapped to
        # the domain entities by hand in the repository layer, so they carry no
        # JSON tags: a change to a column name must not silently change the
        # shape of the public API.
        emit_json_tags: false
        emit_db_tags: false

        # An interface over the generated methods, so services can be tested
        # against a fake without a database when the test is about branching
        # rather than about SQL.
        emit_interface: true

        # A :many query that matches nothing returns an empty slice, not nil.
        # It removes a whole class of nil-check bugs at the JSON boundary,
        # where nil marshals to `null` and an empty slice marshals to `[]`.
        emit_empty_slices: true

        # Nullable columns become pointers rather than pgtype wrappers, so the
        # mapping to domain types is a dereference instead of a .Valid check
        # that is easy to forget.
        emit_pointers_for_null_types: true

        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true

          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "Time"
              import: "time"
              pointer: true

          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              type: "Time"
              import: "time"
              pointer: true

          # bpchar is CHAR(3), the currency columns. Left as a plain string;
          # the domain's shared.Currency wraps it after the trailing-space trim
          # that CHAR semantics make necessary.
          - db_type: "pg_catalog.bpchar"
            go_type: "string"
